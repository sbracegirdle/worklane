[project]
name = "worklane"
version = "0.1.0"
description = "Run bounded coding workers and independent reviews from a GitHub project board"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worklane = "worklane:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["worklane.py", "worklane_tui.py", "worklane_harness.py"]

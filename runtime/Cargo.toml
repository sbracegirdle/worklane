[package]
name = "worklane-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
libc = "0.2.183"
regex = "1.12.2"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.23.0"
toml = "0.8.23"
uuid = { version = "1.18.1", features = ["v4", "v5"] }
